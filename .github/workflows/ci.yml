name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY_ORGS: ghcr.io/rossigee
  CROSSPLANE_VERSION: v2.0.2
  GO_VERSION: '1.26.5'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.12.2

  check-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go.mod and go.sum are up to date
        run: |
          go mod tidy
          git diff --exit-code

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: make test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go Vulnerability Check
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          GOWORK=$(mktemp -d) go install golang.org/x/vuln/cmd/govulncheck@v1.5.0 || { mv go.mod.bak go.mod 2>/dev/null; mv go.sum.bak go.sum 2>/dev/null; exit 1; }
          (GOFLAGS=-mod=mod GOWORK=$GOWORK go run -mod=mod golang.org/x/vuln/cmd/govulncheck ./... 2>&1 || true) | tee /tmp/govulncheck.out >/dev/null
          mv go.mod.bak go.mod && mv go.sum.bak go.sum
          if grep -q "^Vulnerability #" /tmp/govulncheck.out; then
            FIXED=$(grep -c "Fixed in: N/A" /tmp/govulncheck.out || true)
            TOTAL=$(grep -c "^Vulnerability #" /tmp/govulncheck.out || true)
            if [ "$FIXED" -lt "$TOTAL" ]; then
              echo "govulncheck: $TOTAL vulnerabilities found ($FIXED unfixable, $((TOTAL - FIXED)) fixable)"
              rm -f /tmp/govulncheck.out; exit 1
            else
              echo "govulncheck: $TOTAL unfixable vulnerabilities (no fix available), ignoring"
            fi
          else
            echo "No vulnerabilities found."
          fi
          rm -f /tmp/govulncheck.out

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  build:
    runs-on: ubuntu-24.04
    needs: [lint, check-diff, unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build provider binary
        run: make build

      - name: Verify build artifacts
        run: |
          ls -lh _output/bin/
          file _output/bin/*/provider || true
